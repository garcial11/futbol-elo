name: Update ratings

# Manual "Run workflow" button only (Actions tab / GitHub mobile web).
# Only someone with write access to this repo can trigger it.
on:
  workflow_dispatch: {}

permissions:
  contents: write          # allow committing the regenerated data back to main

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest results and recompute ratings
        run: python -m elo update --no-push

      - name: Publish if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "No new results — nothing to publish."
          else
            git commit -m "chore: update ratings (manual run)"
            git push origin HEAD:main
          fi
